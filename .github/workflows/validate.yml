name: Validate investment data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and type-check
        run: |
          ruff check scripts tests
          mypy scripts/investment_engine.py scripts/data_quality.py \
            scripts/market_data/base.py scripts/build_snapshot.py \
            scripts/migrate_schema.py scripts/merge_market_config.py
      - name: Run unit tests
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report
      - name: Validate JSON and cross-file references
        run: python scripts/validate_data.py --mode structural
