name: Test market quote collection

on:
  workflow_dispatch:
    inputs:
      session:
        description: Quote session label
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: market-quotes-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MARKET_DATA_PROVIDER: euronext
      EURONEXT_DEFAULT_MIC: XMLI
      EURONEXT_LOCALE: en
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Collect browser-rendered Euronext quotes
        id: collect
        run: |
          SESSION="${{ github.event.inputs.session || 'manual' }}"
          python scripts/quote_collector_browser.py \
            --session "$SESSION" \
            --changed-flag /tmp/quote-data-changed
          if [ -f /tmp/quote-data-changed ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild decision view
        if: steps.collect.outputs.changed == 'true'
        run: |
          python scripts/investment_engine.py
          python scripts/validate_data.py
          python -m unittest discover -s tests -v
      - name: Commit quote updates
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "polsinelli-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add positions.json quote-history.json market-data-config.json investment-view.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualise les cotations via Euronext rendu"
          git push origin HEAD:main
