name: Collect market quotes

on:
  workflow_dispatch:
    inputs:
      session:
        description: Quote session label
        required: false
        default: manual
  schedule:
    # GitHub cron uses UTC. The collector polls every five minutes during the
    # broad European trading window; the provider timestamp records any delay.
    - cron: "*/5 7-18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-quotes-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      MARKET_DATA_PROVIDER: saxo
      SAXO_ENV: ${{ vars.SAXO_ENV || 'sim' }}
      SAXO_ACCESS_TOKEN: ${{ secrets.SAXO_ACCESS_TOKEN }}
      SAXO_ACCOUNT_KEY: ${{ secrets.SAXO_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect structured quotes
        id: collect
        run: |
          SESSION="${{ github.event.inputs.session || 'intraday' }}"
          python scripts/quote_collector.py \
            --session "$SESSION" \
            --allow-unconfigured \
            --changed-flag /tmp/quote-data-changed
          if [ -f /tmp/quote-data-changed ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild decision view
        if: steps.collect.outputs.changed == 'true'
        run: |
          python scripts/investment_engine.py
          python scripts/validate_data.py
          python -m unittest discover -s tests -v
      - name: Commit quote updates
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "polsinelli-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add positions.json quote-history.json market-data-config.json investment-view.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualise les cotations via l’API de marché"
          git push origin HEAD:main
