name: Synchronize Polsinelli tracker

on:
  schedule:
    - cron: "7,22,37,52 6-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polsinelli-tracker-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser runtime
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Synchronize recommendations and quotes
        run: |
          python scripts/migrate_schema.py
          zone_status=0
          python scripts/sync_zonebourse_browser.py --max-article-fetches 16 || zone_status=$?
          if (( zone_status != 0 && zone_status != 2 )); then
            exit "$zone_status"
          fi
          python scripts/quote_collector_browser.py --session github-scheduled
          python scripts/investment_engine.py
          python scripts/validate_data.py --mode structural
          python -m unittest discover -s tests -v
      - name: Publish changed data
        run: |
          git config user.name "polsinelli-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add positions.json quote-history.json market-data-config.json investment-view.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronise automatiquement le tracker Polsinelli"
          git push origin HEAD:main
